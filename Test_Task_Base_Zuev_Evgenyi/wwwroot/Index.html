<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Домашняя библиотека</title>

    <!-- Подключаем стили визуального HTML-редактора Quill -->
    <link href="https://jsdelivr.net" rel="stylesheet">

    <style>
        :root {
            --primary: #007bff;
            --primary-hover: #0056b3;
            --success: #28a745;
            --danger: #dc3545;
            --danger-hover: #bd2130;
            --bg: #f8f9fa;
            --text: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: var(--bg);
            color: var(--text);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
        }

        /* Панель управления (Поиск и кнопки) */
        .controls {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        .search-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

            .search-input:focus {
                border-color: var(--primary);
            }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

            button:active {
                transform: scale(0.98);
            }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

            .btn-primary:hover {
                background: var(--primary-hover);
            }

        .btn-success {
            background: var(--success);
            color: white;
        }

            .btn-success:hover {
                background: #218838;
            }

        .btn-danger {
            padding: 6px 12px;
            font-size: 0.85rem;
            background: var(--danger);
            color: white;
        }

            .btn-danger:hover {
                background: var(--danger-hover);
            }

        /* Таблица со списком книг */
        .table-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 14px 18px;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: #f1f3f5;
            font-weight: 600;
        }

        tbody tr {
            cursor: pointer;
            transition: background-color 0.15s;
        }

            tbody tr:hover {
                background-color: #fdfdfd;
            }

        /* Стили всплывающего модального окна (Карточки книги) */
        .modal {
            display: none; /* Скрыто по умолчанию */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 550px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .modal-header {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.5rem;
            border-bottom: 2px solid #f1f3f5;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 18px;
        }

            .form-group label {
                display: block;
                margin-bottom: 6px;
                font-weight: 600;
                font-size: 0.95rem;
            }

            .form-group input {
                width: 100%;
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 6px;
                box-sizing: border-box;
                font-size: 1rem;
            }

        /* Контейнер для WYSIWYG редактора Quill */
        #editor-container {
            height: 180px;
            border-bottom-left-radius: 6px;
            border-bottom-right-radius: 6px;
            margin-bottom: 10px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 25px;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

            .btn-secondary:hover {
                background: #5a6268;
            }
    </style>
</head>
<body>

    <div class="container">
        <h1>📚 Домашняя библиотека</h1>

        <!-- Панель управления -->
        <div class="controls">
            <input type="text" id="searchInput" class="search-input" placeholder="Поиск по названию, автору или главам оглавления...">
            <button class="btn-primary" onclick="loadBooks()">Найти</button>
            <button class="btn-success" onclick="openModalForCreate()">Добавить книгу</button>
        </div>

        <!-- Таблица списка книг -->
        <div class="table-container">
            <table id="booksTable">
                <thead>
                    <tr>
                        <th>Название книги</th>
                        <th>Автор</th>
                        <th>Год</th>
                        <th>ISBN</th>
                        <th style="width: 100px;">Действия</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Строки с книгами будут генерироваться динамически через JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Модальное окно (Карточка книги) -->
    <div id="bookModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle" class="modal-header">Карточка книги</h3>
            <input type="hidden" id="bookId">

            <div class="form-group">
                <label for="title">Название</label>
                <input type="text" id="title" placeholder="Введите название книги" required>
            </div>

            <div class="form-group">
                <label for="author">Автор</label>
                <input type="text" id="author" placeholder="Имя и фамилия автора" required>
            </div>

            <div class="form-group">
                <label for="publishYear">Год издания</label>
                <input type="number" id="publishYear" placeholder="Например, 2024" required>
            </div>

            <div class="form-group">
                <label for="isbn">Код ISBN (Доп. поле)</label>
                <input type="text" id="isbn" placeholder="978-X-XXXX-XXXX-X">
            </div>

            <div class="form-group">
                <label>Оглавление (Визуальный HTML-редактор)</label>
                <!-- Сюда Quill подставит свою панель инструментов и текстовое поле -->
                <div id="editor-container"></div>
            </div>

            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeModal()">Отмена</button>
                <button class="btn-primary" onclick="saveBook()">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- Подключаем основной JS-движок текстового редактора Quill -->
    <script src="https://jsdelivr.net"></script>
    <!-- Подключаем наш будущий файл логики скриптов -->
    <script src="app.js"></script>

</body>
</html>
